<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f131c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>영웅 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Lexend:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 위 상태줄 · 전장 캔버스(조이스틱/공격 버튼 겹침) · 아래 보스 선택줄 · 탭. 어두운 전장 톤 한 가지로 고정 */
:root{
  color-scheme: dark;
  --bg:#0f131c; --panel:#171d2a; --panel2:#1f2738; --line:#2c364b; --ink:#e9edf5; --ink2:#9aa6bd;
  --gold:#f2a93b; --gold2:#c47f16; --gem:#9b7bff; --red:#ef4b4b; --green:#3ccf8e; --blue:#4aa8ff;
  --disp:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --en:"Lexend","Noto Sans KR",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;touch-action:manipulation;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:980px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px 0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.en{font-family:var(--en);font-weight:600}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:.01em}

.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;flex:1 1 180px;min-width:0}
.lv{font-family:var(--disp);background:var(--gold);color:#1b1206;border-radius:8px;padding:3px 8px;font-size:15px;white-space:nowrap}
.who-name{font-family:var(--disp);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden;flex:1;min-width:50px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gem));width:0;transition:width .3s}
.money{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 5px;font-family:var(--en);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.chip svg{width:20px;height:20px}
.chip.money-c,.chip.money-g{font-size:20px;padding:4px 12px 4px 6px;gap:6px}
.chip.money-c{background:#2a2110;border-color:#a8760f;color:#ffd27a}
.chip.money-g{background:#1d1838;border-color:#6a4fe0;color:#ddd2ff}
.chip.money-c svg,.chip.money-g svg{width:26px;height:26px}
.chip .lab{font-family:var(--disp);font-weight:400;font-size:13px;opacity:.8;white-space:nowrap}
.money{flex-wrap:nowrap;min-width:0}
@media (max-width:420px){.chip.money-c,.chip.money-g{font-size:18px;padding:4px 10px 4px 5px;gap:4px}.chip.money-c svg,.chip.money-g svg{width:22px;height:22px}}
.chip.bump{animation:bump .45s}
.item .pic{position:relative}
.enhb{position:absolute;right:4px;top:4px;font-family:var(--en);font-weight:700;font-size:13px;background:var(--gold);color:#1b1206;border-radius:6px;padding:1px 6px}
.buy.enh{background:var(--gem);color:#fff;font-size:13px;line-height:1.35}
.spelltext.t3 span,.spelltext.t4 span,.spelltext.t5 span{font-size:clamp(28px,7vw,54px);text-shadow:0 0 24px #ffd27a,0 0 44px #9b7bff,0 2px 0 #000}
.spelltext.t5{background:radial-gradient(circle,#ffd27a55,#9b7bff33 45%,#9b7bff00 75%)}
@keyframes bump{40%{transform:scale(1.18)}}
.gear{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.gear svg{width:20px;height:20px}

.view{display:flex;flex-direction:column;gap:10px;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.h2{font-family:var(--disp);font-size:22px;margin:0;font-weight:400}
.sub{color:var(--ink2);margin:4px 0 0;line-height:1.55}

/* 전장 */
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#0b0e15;border:1px solid var(--line);touch-action:none}
@media (max-width:640px){
  .stage{aspect-ratio:1/1.5;background:linear-gradient(180deg,#0b0e15,#141a27)}
  .stage #cv{height:calc(100% - 132px);bottom:auto}
  .padhint{display:flex!important}
}
.padhint{display:none;position:absolute;left:14px;bottom:14px;width:calc(100% - 236px);height:104px;border:2px dashed #ffffff26;border-radius:16px;align-items:center;justify-content:center;
  color:#ffffff66;font-family:var(--disp);font-size:15px;pointer-events:none;z-index:2;text-align:center;line-height:1.4}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovtop{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
#hearts{display:flex;gap:2px;flex-wrap:wrap;max-width:60%}
#hearts svg{width:20px;height:20px;filter:drop-shadow(0 1px 1px #0008)}
.bagbtn{position:absolute;right:10px;top:58px;z-index:4;font-family:var(--disp);font-size:15px;color:#1b1206;background:var(--gold);border-radius:10px;padding:7px 14px;box-shadow:0 3px 0 #6b3f06}
.bagbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b3f06}
.baggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.bagit{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:12.5px;line-height:1.3;min-height:84px}
.bagit svg{width:46px;height:46px}
.bagit.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:#123a2a}
#zoneLbl{font-family:var(--disp);font-size:14px;background:#0b0e15b3;border:1px solid #ffffff22;border-radius:8px;padding:3px 9px;text-align:right;white-space:nowrap}
#zoneLbl small{display:block;font-family:var(--body);font-size:11px;color:var(--ink2)}
.learn{position:absolute;left:50%;top:40px;transform:translateX(-50%);z-index:4;background:#0b0e15d9;border:1px solid #ffffff2a;border-radius:12px;padding:7px 12px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 24px);box-sizing:border-box;animation:fadein .25s}
.learn .w{font-family:var(--en);font-weight:700;font-size:18px;color:var(--gold)}
.learn .s{font-family:var(--en);font-weight:500;font-size:15px}
.learn .k{font-size:12px;color:var(--ink2)}
.learn button{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center}
.learn button svg{width:18px;height:18px}
@keyframes fadein{from{opacity:0;transform:translate(-50%,-6px)}}
.spelltext{position:absolute;inset:0;display:grid;place-items:center;z-index:5;pointer-events:none;background:radial-gradient(circle,#9b7bff40,#9b7bff00 65%);animation:fade 1.6s forwards}
.spelltext span{font-family:var(--en);font-weight:700;font-size:clamp(22px,5.4vw,40px);color:#fff;text-shadow:0 0 18px #9b7bff,0 2px 0 #000;text-align:center;padding:0 12px}
.spelltext small{display:block;font-family:var(--disp);font-size:16px;color:#d9ccff;margin-top:4px}
@keyframes fade{0%{opacity:0}12%,78%{opacity:1}100%{opacity:0}}
#joy{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff14;z-index:4;pointer-events:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#ffffffaa}
.atkbtn{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:12px;width:100px;height:100px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#ff8a5a,#d8441d);border:3px solid #ffd2b8;color:#fff;font-family:var(--disp);font-size:20px;box-shadow:0 5px 0 #7a2208,0 0 0 4px #00000055}
.atkbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #7a2208}
.spellbtn{position:absolute;right:calc(120px + env(safe-area-inset-right,0px));bottom:16px;width:74px;height:74px;border-radius:50%;z-index:4;display:grid;place-items:center;
  background:conic-gradient(var(--gem) var(--m,0%),#2a2340 0);border:3px solid #cdbdff;color:#fff;font-family:var(--disp);font-size:13px;line-height:1.1;text-align:center;padding:4px;box-sizing:border-box}
.spellbtn[disabled]{opacity:.45;cursor:default}
.spellbtn.ready{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 18px #b49dff}}
.keyhint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#ffffff99;z-index:3;pointer-events:none}
@media (hover:none){.keyhint{display:none}}
.ovbox{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#05070cbf;padding:16px;text-align:center}
.ovbox .in{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:360px}

/* 보스 선택줄 */
.bossbar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.bossbar .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--disp);font-size:13px;color:#1b1206;background:var(--gold);border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.v{background:var(--gem);color:#fff}
.mko{font-family:var(--disp);font-size:18px;flex:1;min-width:0}
.men{font-family:var(--en);font-weight:600;font-size:clamp(20px,4.4vw,28px);line-height:1.25}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.opt{font-family:var(--en);font-weight:600;font-size:22px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px 8px;min-height:58px}
.mini button{min-height:40px}
.choice .c{min-height:54px}.choice .ear{min-width:50px}
.lvup .pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:64px}
.lvup .pick:hover,.lvup .pick:active{border-color:var(--gold)}
.lvup .pick b{font-family:var(--disp);font-weight:400;font-size:22px;color:var(--gold)}
.lvup .pick span{font-size:14px;color:var(--ink2);line-height:1.5}
.lvbig{font-family:var(--en);font-weight:700;font-size:30px;letter-spacing:.2em;text-align:center;margin:0;color:var(--gold);text-shadow:0 0 18px #f2a93b88}
#hearts svg.hpop{animation:bump .5s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.opt.right{border-color:var(--green);background:#123a2a;opacity:1;text-decoration:none}
.explain{background:#2a1b22;border:1px solid #6b2f3c;border-radius:10px;padding:8px 10px;line-height:1.55;font-size:14px}
.explain b{font-family:var(--en)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:4px}
.mini svg{width:15px;height:15px}

/* 탭 */
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));margin-top:auto;z-index:10;border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-family:var(--disp);font-size:14px;color:var(--ink2)}
.tab svg{width:24px;height:24px}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* 상점·펫 */
.seg{display:flex;gap:6px}
.seg button{flex:1;font-family:var(--disp);font-size:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.seg button.on{background:var(--gold);color:#1b1206;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.item.cur{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.item.lock{opacity:.5}
.item .pic{width:96px;height:96px;display:grid;place-items:center;background:radial-gradient(circle,#2a3348,#171d2a);border-radius:12px}
.item .pic svg{width:84px;height:84px}
.item .nm{font-family:var(--disp);font-size:17px}
.item .ef{font-size:12.5px;color:var(--ink2);min-height:2.8em;line-height:1.45}
.buy{width:100%;font-family:var(--en);font-weight:600;font-size:15px;border-radius:10px;padding:8px 6px;background:var(--gold);color:#1b1206;display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.buy svg{width:17px;height:17px}
.buy.ok{background:var(--green);color:#06210f;font-family:var(--disp);font-weight:400}
.buy.sec{background:var(--panel2);color:var(--ink);font-family:var(--disp);font-weight:400;border:1px solid var(--line)}
.buy:disabled{background:#333c50;color:#8893a8;cursor:default}
.preview{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.preview .pv{width:110px;flex:0 0 auto;background:radial-gradient(circle,#2a3348,#171d2a);border-radius:12px}
.preview .pv svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;font-size:13px;color:var(--ink2)}
.stats b{display:block;color:var(--ink);font-family:var(--en);font-size:17px}

/* 주문책 */
.answer{min-height:54px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.answer.ok{border-color:var(--green);background:#123a2a}
.answer.no{border-color:var(--red);animation:shake .35s}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--en);font-weight:600;font-size:19px;background:var(--panel2);border:1px solid #445071;border-radius:10px;padding:6px 12px;box-shadow:0 3px 0 #0a0d14}
.tile.used{visibility:hidden}
.tile.bad{border-color:var(--red);color:#ffb3b3}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--disp);font-size:16px;border-radius:10px;padding:8px 14px;background:var(--panel2);border:1px solid var(--line)}
.btn.main{background:var(--gem);color:#fff;border-color:var(--gem)}
.btn.gold{background:var(--gold);color:#1b1206;border-color:var(--gold)}
.btn.warn{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.typein,.field-in{width:100%;font-family:var(--en);font-size:19px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1018;color:var(--ink);box-sizing:border-box;user-select:text;-webkit-user-select:text}
.lvl{font-family:var(--en);color:var(--gold);letter-spacing:2px}
.spells{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.sp{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:4px}
.sp.eq{border-color:var(--gem);box-shadow:inset 0 0 0 1px var(--gem)}
.sp .t{font-family:var(--en);font-weight:600;font-size:15px}
.sp .e{font-size:12px;color:#c9b8ff}

/* 야구 */
.field{position:relative;aspect-ratio:1/0.78;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.field svg.bg{position:absolute;inset:0;width:100%;height:100%}
.zone{position:absolute;top:10%;width:30%;height:32%;border-radius:14px;background:#ffffff1a;border:2px dashed #ffffff99;display:flex;align-items:center;justify-content:center;
  font-family:var(--en);font-weight:700;font-size:clamp(17px,4.4vw,28px);color:#fff;text-shadow:0 2px 3px #000a}
.zone.l{left:3%;top:22%}.zone.c{left:35%}.zone.r{right:3%;top:22%}
.zone.pick{background:#f2a93b55;border-style:solid;border-color:var(--gold)}
.zone.good{background:#3ccf8e66;border-color:var(--green)}
.zone.badz{background:#ef4b4b55;border-color:var(--red)}
.ball{position:absolute;width:4.6%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset -2px -2px 0 #ccc,0 0 0 1px #c33;left:47.7%;top:50%;z-index:3;transform:translate(-50%,-50%) scale(.6)}
.batter{position:absolute;left:50%;bottom:2%;width:15%;transform:translateX(-80%);z-index:2}
.batter svg{width:100%;height:auto;display:block}
.callout{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:clamp(28px,7vw,52px);color:#fff;text-shadow:0 3px 0 #000,0 0 20px #000;z-index:5;animation:popin .45s;white-space:nowrap}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.4)}70%{transform:translate(-50%,-50%) scale(1.12)}}
.swing{font-family:var(--disp);font-size:26px;border-radius:14px;padding:14px;background:radial-gradient(circle at 35% 30%,#ff8a5a,#d8441d);color:#fff;box-shadow:0 5px 0 #7a2208}
.swing:disabled{background:#333c50;box-shadow:0 5px 0 #222a39;color:#8893a8}

.modal{position:fixed;inset:0;background:#04060bcc;display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto;box-sizing:border-box}
.sheet label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=password],.sheet select{font-family:var(--body);font-size:16px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0c1018;color:var(--ink);width:55%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.sheet textarea{width:100%;min-height:70px;font-size:12px;font-family:ui-monospace,monospace;background:#0c1018;color:var(--ink);border:1px solid var(--line);border-radius:8px;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.npc{display:flex;gap:12px;align-items:flex-start}
.npc .face{width:78px;flex:0 0 auto;background:radial-gradient(circle,#2a3348,#171d2a);border-radius:12px}
.npc .face svg{width:100%;height:auto;display:block}
.say{line-height:1.6}
.say .q{font-family:var(--en);font-weight:600;font-size:20px;color:var(--gold)}
.choice{display:flex;gap:6px;align-items:stretch}
.choice .c{flex:1;text-align:left;font-family:var(--en);font-weight:600;font-size:17px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.choice .c.ko{font-family:var(--disp);font-weight:400}
.choice .c:disabled{opacity:.35;text-decoration:line-through}
.choice .c.right{border-color:var(--green);background:#123a2a;opacity:1;text-decoration:none}
.choice .ear{width:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.choice .ear svg{width:18px;height:18px}
.excl{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.excl label{justify-content:flex-start;gap:8px}

function migrate(d){
  const s=JSON.parse(JSON.stringify(DEF));if(!d||typeof d!=='object'||d.epoch!==EPOCH)return s;
  d=JSON.parse(JSON.stringify(d));
  if(d.v!==2){ // 첫 버전 저장 → 새 구조
    s.coins=d.coins||0;s.gems=d.gems||0;s.xp=d.xp||0;s.weapon=Math.min(8,d.weapon||0);
    s.name=(d.name&&d.name!=='용사')?d.name:'민결';
    const old={chick:10,puppy:20,kitty:30,penguin:45,dragon:70,unicorn:100};
    (d.pets||[]).forEach(p=>s.gems+=old[p]||0);s.gems+=(d.spells||[]).length*2;
    s.ballOpen=!!(d.tickets||(d.stats&&d.stats.games));s.savedAt=d.savedAt||0;
    if(d.settings){s.settings.sound=d.settings.sound!==false;s.settings.voice=d.settings.voice!==false}
    return s;
  }
  Object.assign(s,d);
  s.stats=Object.assign({},DEF.stats,d.stats||{});s.settings=Object.assign({},DEF.settings,d.settings||{});
  s.day=Object.assign({},DEF.day,d.day||{});s.stat=Object.assign({},DEF.stat,d.stat||{});s.enh=d.enh||{};
  if(!d.own){ // 아이템이 늘기 전 저장 → 새 목록 번호로 옮김
    const mw=[0,2,3,5,6,7,10,16,23],mb=[0,1,3,4,6,10],ma=[0,1,3,4,8],up=n=>Array.from({length:n+1},(_,i)=>i);
    s.weapon=mw[d.weapon]||0;s.boots=mb[d.boots]||0;s.armor=ma[d.armor]||0;s.own={weapon:up(s.weapon),boots:up(s.boots),armor:up(s.armor),acc:[]};s.acc=null}
  else s.own=Object.assign({weapon:[0],boots:[0],armor:[0],acc:[]},d.own);s.M=d.M||{};s.spells=d.spells||{};
  return s;
}

const SYNC_KEY='english-hero-sync';

function syncCreds(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))}catch(e){return null}}
async function syncApi(action,body){
  const r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},keepalive:action==='save',body:JSON.stringify(Object.assign({action},body))});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'연결 오류');e.status=r.status;throw e}return j;
}
function webAdapter(c){return {web:true,id:c.id,get:async()=>{const j=await syncApi('load',c);return {exists:!!j.exists,data:()=>j.data}},set:async d=>{await syncApi('save',Object.assign({},c,{data:d}))}}}
async function connectSync(id,pin){
  const c={id:String(id).trim().toLowerCase(),pin:String(pin).trim()};
  const j=await syncApi('load',c);
  try{localStorage.setItem(SYNC_KEY,JSON.stringify(c))}catch(e){}
  cloud.ref=webAdapter(c);cloud.on=true;
  const d=j.exists?j.data:null;
  if(d&&d.epoch===EPOCH&&(d.savedAt||0)>(S.savedAt||0)){S=migrate(d);buildSents();saveLocal();resetWorld();renderAll();renderOpening();toast('저장된 모험을 불러왔어요 ('+c.id+')');return 'loaded'}
  if(!S.savedAt)S.savedAt=Date.now();await pushCloud();return d?'kept':'new';
}

async function initCloud(tries=0){
  if(!(window.claude&&window.claude.use)){if(tries<8)setTimeout(()=>initCloud(tries+1),500);else initWebSync();return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    cloud.ref=db.doc('data/users/'+uid+'/save');
    const snap=await cloud.ref.get();const remote=snap.exists&&snap.data().epoch===EPOCH?snap.data():null;
    if(remote&&(remote.savedAt||0)>(S.savedAt||0)){S=migrate(remote);buildSents();saveLocal();resetWorld();renderAll();renderOpening();toast('저장된 모험을 불러왔어요')}
    cloud.on=true;if(!remote||(S.savedAt||0)>(remote.savedAt||0))pushCloud();
  }catch(e){}
}

   4. 소리 · 음성
   ========================================================= */
let actx=null;
function beep(f,d=.08,type='square',vol=.05){
  if(!S.settings.sound)return;
  try{if('speechSynthesis' in window&&speechSynthesis.speaking)vol*=.3;
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d+.02)}catch(e){}
}
const jingle=(n,gap=90)=>n.forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.06),i*gap));
let voiceEn=null;
// 원어민처럼 들리는 목소리를 우선 고름 (엣지 Natural, 구글, 애플 향상된 음성 등). 로봇 같은 목소리는 뒤로.
function voiceScore(v){const n=v.name;let s=/^en[-_]US/i.test(v.lang)?3:/^en/i.test(v.lang)?1:-99;
  if(/Natural|Neural|Online/i.test(n))s+=8;if(/Premium/i.test(n))s+=7;if(/Enhanced|향상/i.test(n))s+=6;if(/Google US English/i.test(n))s+=6;if(/Siri/i.test(n))s+=5;
  if(/Samantha|Ava|Aria|Jenny|Allison|Susan|Joelle|Nicky|Zoe|Evan|Nathan|Guy|Michelle|Ana/i.test(n))s+=2;
  if(/Zira|David|Mark|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Wobble|Whisper|Zarvox|Trinoids|Junior|Ralph|Kathy|Princess|Jester|Organ|Superstar|Grandpa|Grandma|Rocko|Shelley|Sandy|Reed|Eddy|Flo/i.test(n))s-=6;
  if(v.localService===false)s+=1;return s}
function enVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a))}catch(e){return []}}
function pickVoice(){const vs=enVoices();voiceEn=vs.find(v=>v.name===S.settings.voiceName)||vs[0]||null}
try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,o={}){
  if(!S.settings.voice||!('speechSynthesis' in window))return;
  try{
    if(o.idle&&(speechSynthesis.speaking||speechSynthesis.pending))return;
    const busy=speechSynthesis.speaking||speechSynthesis.pending;if(busy)speechSynthesis.cancel();
    if(speechSynthesis.paused)speechSynthesis.resume();
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=o.rate||S.settings.rate;if(voiceEn)u.voice=voiceEn;
    if(o.owl&&S.pet==='owl')u.onend=()=>{const u2=new SpeechSynthesisUtterance(text);u2.lang='en-US';u2.rate=.62;if(voiceEn)u2.voice=voiceEn;speechSynthesis.speak(u2)};
    busy?setTimeout(()=>speechSynthesis.speak(u),80):speechSynthesis.speak(u);
  }catch(e){}
}

// 마법 위력: 주문 별 + 외운 주문 수 + 레벨 + 장신구. 셀수록 화려해지고 쿨타임도 길어짐
function spellPower(){const id=S.spellEq;const lv=id!=null?(S.spells[id]||1):1;return lv+Math.floor(Object.keys(S.spells).length/4)+Math.floor(level()/5)+Math.round(accV('magic'))}
const spellCDmax=()=>Math.round(8+spellPower()*3);
function renderSpellBtn(){
  const b=$('#spellBtn'),has=S.spellEq!=null&&S.spells[S.spellEq]&&sentById(S.spellEq),ready=!!has&&G.spellCD<=0;
  b.style.setProperty('--m',(has?(1-Math.max(0,G.spellCD)/G.spellMax)*100:0)+'%');
  b.disabled=!ready;b.classList.toggle('ready',ready);
  b.innerHTML=has?(ready?SPELLFX[spellType(sentById(S.spellEq))]+'<br>위력 '+spellPower():Math.ceil(G.spellCD)+'초'):'주문 없음';
}
function castSpell(){
  if(G.spellCD>0||S.spellEq==null||!S.spells[S.spellEq]||G.dead)return;
  const s=sentById(S.spellEq);if(!s)return;const ty=spellType(s),pw=spellPower(),h=G.hero,tier=Math.min(5,Math.floor(pw/2));

  $('#spellFx').innerHTML=`<div class="spelltext t${tier}"><span>${esc(s.en)}<small>${SPELLFX[ty]} · 위력 ${pw}</small></span></div>`;setTimeout(()=>$('#spellFx').innerHTML='',1650);
  speak(s.en);jingle([392,523,659,784,1046,1318,1568,2093].slice(0,4+tier),60);
  G.flash=.2+tier*.07;G.flashC=col;G.shake=.2+tier*.08;
  for(let k=0;k<=tier;k++)G.rings.push({x:h.x,y:h.y-10,R:110+k*60+tier*30,t:.6+k*.12,max:.6+k*.12,w:5+tier*2,col});
  for(let i=0;i<40+tier*30;i++){const a=Math.random()*6.28,sp=rnd(80,260+tier*60);G.parts.push({x:h.x,y:h.y-24,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.6,life:rnd(.5,.9+tier*.1),color:i%3?col:'#ffffff',r:rnd(1.5,3.5+tier*.4)})}

  if(ty==='wave'||ty==='water'){inView().forEach(m=>{damageMob(m,pw*3,'spell');if(tier>=3)m.slow=2});if(ty==='water'){h.hp=Math.min(maxHp(),h.hp+1+Math.floor(tier/2));renderHearts(1)}}
  if(ty==='heal'){h.hp=Math.min(maxHp(),h.hp+1+Math.ceil(pw/2));renderHearts(1);if(tier>=2)inView().forEach(m=>damageMob(m,pw,'spell'))}
  if(ty==='shield'){h.shield=4+pw;if(tier>=2)inView().forEach(m=>{m.x+=(m.x>h.x?1:-1)*60})}

  if(ty==='freeze'){G.freeze=3+pw;if(tier>=2)inView().forEach(m=>damageMob(m,pw*2,'spell'))}
  if(ty==='ally')G.ally={x:h.x-h.face*30,y:h.y,t:5+pw,atk:.2};
  if(S.pet==='dragon')inView().forEach(m=>{if(Math.abs(m.x-h.x)<160)damageMob(m,3+tier,'pet')});
  renderSpellBtn();
}

// 큰 숫자는 한국식으로 짧게: 12,345 → 1.2만, 430,040 → 43만, 1억 이상 → 1.2억
function fmtN(n){if(n>=1e8)return (n/1e8).toFixed(1).replace(/\.0$/,'')+'억';if(n>=1e5)return Math.floor(n/1e4)+'만';if(n>=1e4)return (n/1e4).toFixed(1).replace(/\.0$/,'')+'만';return n.toLocaleString()}

/* ---- 상점 ---- */
let shopCat='weapon';
const priceHTML=(c,g)=>(c?ICON.coin+c.toLocaleString():'')+(c&&g?' + ':'')+(g?ICON.gem+g:'')||'무료';
const CATS={weapon:WEAPONS,boots:BOOTS,armor:ARMORS,acc:ACCS};
const MAXE=15;
// 강화 비용은 단계마다 커지고, +5부터는 보석도 듦. 실패해도 아이템은 그대로.
function enhCost(cat,i){const it=CATS[cat][i],e=enhOf(cat,i);return {c:Math.round(Math.max(40,it.cc*.12+30)*Math.pow(1.32,e)/10)*10,g:e>=5?Math.ceil((e-3)/2):0,rate:e<5?1:e<8?.85:e<11?.7:.55}}
function itemEf(cat,i){const it=CATS[cat][i],e=enhOf(cat,i);
  if(cat==='weapon'){const tier=e>=15?'각성':e>=10?'강화됨':e>=5?'발동':'';return `공격력 ${wDmg(i)} · 거리 ${it.r}<br>효과: ${ELFX[it.el]} ${e>=5?`<b style="color:#f2a93b">(${tier})</b>`:'(+5에서 열림)'}`}
  if(cat==='boots')return `이동 속도 ${it.s+3*e}${i>=3?'<br>도망치는 몬스터 추격':''}`;
  if(cat==='armor')return `하트 ${it.h+Math.floor(e/3)}칸 · 막기 ${it.blk+Math.round(e*.6)}%`;
  return esc(it.d)+(e?` (효과 x${(1+.1*e).toFixed(1)})`:'');}
const accSVG=(c,i)=>`<svg ${NS} viewBox="0 0 60 60">${i%3===0?`<circle cx="30" cy="36" r="14" fill="none" stroke="#c9a23a" stroke-width="6"/><path d="M30 10 l8 9 -8 9 -8 -9z" fill="${c}" stroke="#fff" stroke-width="1.5"/>`:i%3===1?`<path d="M14 8 Q30 34 46 8" stroke="#c9a23a" stroke-width="2.5" fill="none"/><circle cx="30" cy="38" r="12" fill="${c}" stroke="#c9a23a" stroke-width="3"/><circle cx="26" cy="34" r="3" fill="#ffffff88"/>`:`<circle cx="30" cy="30" r="18" fill="${c}" stroke="#7a5a10" stroke-width="3"/><path d="M30 18 l3.5 7 7.5 1 -5.5 5 1.5 7.5 -7 -4 -7 4 1.5 -7.5 -5.5 -5 7.5 -1z" fill="#ffffffaa"/>`}</svg>`;
function itemPic(cat,i){const it=CATS[cat][i];return cat==='weapon'?weaponSVG(i,null,enhOf('weapon',i)):cat==='boots'?bootSVG(it.c):cat==='armor'?armorSVG(it.c,i):accSVG(it.c,i)}

    <p class="sub">아이템을 사서 장착하고, 강화하면 더 세져요. 무기는 +5부터 공격할 때 특별한 효과가 나와요(+10 더 자주, +15 각성).</p></div></div>
    <div class="seg">${[['weapon','무기'],['boots','신발'],['armor','갑옷'],['acc','장신구']].map(([k,n])=>`<button data-cat="${k}" class="${shopCat===k?'on':''}">${n}</button>`).join('')}</div>

  list.forEach((it,i)=>{
    const owned=own.includes(i),e=enhOf(shopCat,i),open=shopCat==='acc'||i===0||own.includes(i-1),can=open&&S.coins>=it.cc&&S.gems>=it.gc;
    let btn;

  });

const SP={s:null,mode:1,tiles:[],picked:[],state:'',msg:''};
const usesTyping=()=>S.settings.input==='typing';
const words=s=>s.en.replace(/[.?!,]/g,'').split(' ').filter(Boolean);
function setSpell(s){
  SP.s=s;const lv=S.spells[s.id]||0;SP.mode=Math.min(3,lv+1);SP.picked=[];SP.state='';SP.msg='';
  const extra=shuffle(s.opts)[0].split(' ');
  if(SP.mode===1)SP.tiles=shuffle([...words(s),extra[0]]);
  else if(SP.mode===2)SP.tiles=shuffle([s.key,...s.opts,...shuffle(['need','want','have','like','can','is','are','do'].filter(x=>x!==s.key&&!s.opts.includes(x))).slice(0,1)]);
  else SP.tiles=shuffle([...words(s),...shuffle(s.opts).slice(0,2).map(x=>x.split(' ')[0])]);
}
function nextSpell(){const un=SENTS.filter(s=>active(s)&&(S.spells[s.id]||0)<3);const pool=un.length?un:SENTS.filter(active);
  const learnedLow=pool.filter(s=>S.spells[s.id]);setSpell(learnedLow.length&&Math.random()<.5?pick(learnedLow,x=>'s'+x.id):pool.find(s=>!S.spells[s.id])||pick(pool,x=>'s'+x.id))}
function renderSpells(){
  if(!SP.s)nextSpell();const s=SP.s,lv=S.spells[s.id]||0,typing=usesTyping();
  const modeName=['','1단계 · 단어 블록 순서 맞추기','2단계 · 빠진 단어 고르기','3단계 · 문장 전체 쓰기'][SP.mode];
  let body='';
  if(SP.mode===2){body+=`<div class="men">${esc(blankEn(s,'\u0001')).replace('\u0001','<span class="blank">'+(SP.picked.length?esc(SP.tiles[SP.picked[0]]):'&nbsp;')+'</span>')}</div>`;
    body+=`<div class="tiles">${SP.tiles.map((t,k)=>`<button class="tile" data-one="${k}">${esc(t)}</button>`).join('')}</div>`}
  else if(SP.mode===3&&typing)body+=`<input class="typein" id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어 문장을 써요">`;
  else body+=`<div class="answer ${SP.state}" id="answer">${SP.picked.map((ti,k)=>`<button class="tile" data-un="${k}">${esc(SP.tiles[ti])}</button>`).join('')||'<span class="sub" style="margin:0">아래 블록을 순서대로 눌러요</span>'}</div>
    <div class="tiles">${SP.tiles.map((t,k)=>`<button class="tile ${SP.picked.includes(k)?'used':''}" data-pick="${k}">${esc(t)}</button>`).join('')}</div>`;
  const learned=SENTS.filter(x=>S.spells[x.id]);
  let h=`<div class="card"><p class="h2">마법 주문책</p><p class="sub">한국어 문장을 영어로 만들면 마법 주문이 돼요. 같은 문장을 1단계 블록 → 2단계 빈칸 → 3단계 전체 쓰기로 올리면 주문이 강해져요. 대소문자·마침표는 틀려도 괜찮아요.</p>
    <div class="row" style="margin-top:8px"><span class="sub" style="margin:0">입력 방식</span><div class="seg" style="flex:1;max-width:320px">${[['blocks','블록 (핸드폰)'],['typing','키보드로 쓰기']].map(([k,n])=>`<button data-inp="${k}" class="${(S.settings.input==='typing'?'typing':'blocks')===k?'on':''}">${n}</button>`).join('')}</div></div></div>
   <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="row" style="justify-content:space-between"><span class="tag v">${modeName}</span><span class="lvl">${'★'.repeat(lv)}${'☆'.repeat(3-lv)}</span></div>
    <div class="disp" style="font-size:24px">${esc(s.ko)}</div><div class="sub" style="margin:0">주문 효과: ${SPELLFX[spellType(s)]}${s.pat&&SP.mode===1?' · 패턴 '+esc(PATTERN_NAMES[s.pat]):''}</div>
    ${body}${SP.msg}
    <div class="row"><button class="btn main" id="spCheck">주문 외우기</button><button class="btn" id="spHear">듣기</button><button class="btn" id="spSlow">천천히</button>${SP.mode!==2&&!(SP.mode===3&&typing)?'<button class="btn" id="spClear">지우기</button>':''}<button class="btn" id="spSkip">다른 문장</button></div></div>`;
  if(learned.length)h+=`<div class="card"><p class="h2" style="font-size:18px">외운 주문 ${learned.length}개</p><p class="sub">전투에서 쓸 주문 하나를 장착해요. 문장을 누르면 연습할 수 있어요.</p>
    <div class="spells" style="margin-top:8px">${learned.map(x=>`<div class="sp ${S.spellEq===x.id?'eq':''}"><span class="t">${esc(x.en)}</span><span class="e">${SPELLFX[spellType(x)]} · <span class="lvl">${'★'.repeat(S.spells[x.id])}</span></span>
      <div class="row"><button class="btn" data-eq="${x.id}" ${S.spellEq===x.id?'disabled':''}>${S.spellEq===x.id?'장착 중':'장착'}</button><button class="btn" data-prac="${x.id}">연습</button><button class="btn" data-say="${x.id}">듣기</button></div></div>`).join('')}</div></div>`;
  $('#v-spells').innerHTML=h;
}
$('#v-spells').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const s=SP.s;
  if(t.dataset.inp){S.settings.input=t.dataset.inp;save();renderSpells();return}
  if(t.dataset.pick!=null){const k=+t.dataset.pick;if(!SP.picked.includes(k)){SP.picked.push(k);SP.state=''}renderSpells();return}
  if(t.dataset.un!=null){SP.picked.splice(+t.dataset.un,1);SP.state='';renderSpells();return}
  if(t.dataset.one!=null){SP.picked=[+t.dataset.one];checkSpell();return}
  if(t.dataset.eq){S.spellEq=+t.dataset.eq;save();renderSpells();renderSpellBtn();return}
  if(t.dataset.prac){setSpell(sentById(+t.dataset.prac));renderSpells();return}
  if(t.dataset.say){speak(sentById(+t.dataset.say).en);return}
  if(t.id==='spClear'){SP.picked=[];SP.state='';renderSpells();return}
  if(t.id==='spSkip'){nextSpell();renderSpells();return}
  if(t.id==='spHear'){speak(s.en);return}if(t.id==='spSlow'){speak(s.en,{rate:.6});return}

});
$('#v-spells').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typein')checkSpell()});
function checkSpell(){
  const s=SP.s,typing=usesTyping();let got,want;
  if(SP.mode===2){want=norm(s.key);got=typing&&$('#typein')?norm($('#typein').value):norm(SP.tiles[SP.picked[0]]||'')}
  else{want=norm(s.en);got=(SP.mode===3&&typing)?norm($('#typein').value):norm(SP.picked.map(k=>SP.tiles[k]).join(' '))}
  if(!got)return;
  if(got===want){
    const lv=S.spells[s.id]||0,up=SP.mode>lv;if(up)S.spells[s.id]=SP.mode;if(S.spellEq==null)S.spellEq=s.id;
    const g=up?(SP.mode===3?3:2):1;S.gems+=g;S.xp+=4;mark('s'+s.id,true);save();renderHUD();renderSpellBtn();
    speak(s.en,{owl:1});jingle([523,784,1046,1568],90);
    SP.state='ok';SP.msg=`<div class="explain" style="background:#123a2a;border-color:#2f7a55">${up?(lv?'주문이 강해졌어요!':'새 주문을 외웠어요!'):'복습 완료!'} 보석 +${g} · <b>${esc(s.en)}</b></div>`;
    renderSpells();const prev=s;setTimeout(()=>{if(SP.s===prev&&tab==='spells'){nextSpell();renderSpells()}},1900);
  }else{
    SP.state='no';mark('s'+s.id,false);beep(150,.25,'sawtooth',.05);
    SP.msg=`<div class="explain">조금만 다시! ${SP.mode===1?'빨간 블록부터 다시 봐요.':'듣기를 눌러 문장을 들어 봐요.'}${S.pet==='togyeol'?' (토결이: 할 수 있어!)':''}</div>`;
    const keep=SP.picked.slice();if(SP.mode===2)SP.picked=[];renderSpells();
    if(SP.mode!==2&&!(SP.mode===3&&typing)){const ws=words(s).map(norm);document.querySelectorAll('#answer .tile').forEach((el,i)=>{if(norm(SP.tiles[keep[i]])!==ws[i])el.classList.add('bad')})}
  }
}

const BB={on:false,ab:0,s:null,opts:[],choice:-1,phase:'',t0:0,dur:1700,raf:0,gems:0,coins:0,hits:0,homers:0,right:0};
const AT_BATS=5;

    <div class="field" id="field">${fieldBg()}${['l','c','r'].map((z,i)=>`<button class="zone ${z} ${BB.choice===i?'pick':''}" data-z="${i}" ${BB.phase!=='choose'?'disabled':''}>${esc(BB.opts[i]||'')}</button>`).join('')}

function startBall(){Object.assign(BB,{on:true,ab:0,gems:0,coins:0,hits:0,homers:0,right:0});nextPitch()}
function nextPitch(){
  if(BB.ab>=AT_BATS)return endBall();
  BB.ab++;BB.s=pick(bossPool(),x=>'s'+x.id);BB.opts=shuffle([BB.s.key,...shuffle(BB.s.opts).slice(0,2)]);BB.choice=-1;BB.phase='choose';renderBall();
}
function choosePitch(i){if(BB.phase!=='choose')return;BB.choice=i;renderBall();setTimeout(throwBall,700)}
function throwBall(){
  if(!BB.on)return;BB.phase='pitch';renderBall();BB.dur=S.pet==='dog'?2500:1700;BB.t0=performance.now();const ball=$('#ballEl');ball.hidden=false;
  const step=()=>{if(!BB.on||BB.phase!=='pitch')return;const p=(performance.now()-BB.t0)/BB.dur;
    ball.style.top=(52+p*38)+'%';ball.style.left='50%';ball.style.transform=`translate(-50%,-50%) scale(${.5+p*1.3})`;
    if(p>1.25){swing(true);return}BB.raf=requestAnimationFrame(step)};step();
}
function swing(miss){
  if(BB.phase!=='pitch')return;BB.phase='result';cancelAnimationFrame(BB.raf);
  const p=(performance.now()-BB.t0)/BB.dur,s=BB.s,right=BB.opts[BB.choice]===s.key;
  let call,timing=miss?0:(S.pet==='graybear'?p>=.78&&p<=1.12:p>=.86&&p<=1.06)?2:(p>=.66&&p<1.18?1:0);
  if(right){BB.right++;mark('s'+s.id,true);if(BB.gems<5){BB.gems++}}else mark('s'+s.id,false);
  if(timing&&right){const c=timing===2?30:15;BB.coins+=c;if(timing===2){BB.homers++;S.stats.homers++;call='홈런!'}else{BB.hits++;S.stats.hits++;call='안타!'}}
  else if(timing&&!right)call='잡혔다! 아웃';else call=right?'헛스윙! (정답은 맞았어요)':'헛스윙';
  renderBall();
  const zs=document.querySelectorAll('.zone');zs[BB.choice]?.classList.add(right?'good':'badz');zs[BB.opts.indexOf(s.key)]?.classList.add('good');
  const ball=$('#ballEl');ball.hidden=false;
  if(timing){const z=zs[BB.choice],f=$('#field').getBoundingClientRect(),r=z.getBoundingClientRect();ball.style.transition='all .6s ease-out';ball.style.top='88%';void ball.offsetWidth;
    ball.style.left=((r.left+r.width/2-f.left)/f.width*100)+'%';ball.style.top=((r.top+r.height/2-f.top)/f.height*100)+'%';ball.style.transform='translate(-50%,-50%) scale(.5)'}
  const d=document.createElement('div');d.className='callout';d.textContent=call;$('#field').appendChild(d);
  if(right){speak(s.en,{owl:1});jingle(timing===2?[523,659,784,1046,1318]:[660,880])}else beep(150,.3,'sawtooth',.06);
  if(!right){const ex=document.createElement('div');ex.className='explain';ex.innerHTML=`<b>${esc(BB.opts[BB.choice])}</b> = ${esc(MEAN[BB.opts[BB.choice]]||'다른 뜻')}. 정답은 <b>${esc(s.key)}</b> → ${esc(s.en)}`;$('#v-ball').appendChild(ex)}
  save();setTimeout(()=>{if(BB.on)nextPitch()},2600);
}
function endBall(quiet){
  cancelAnimationFrame(BB.raf);const was=BB.on;BB.on=false;if(!was)return;
  if(quiet&&BB.ab<=1&&BB.phase!=='result')return;

}

    <label>영어 목소리 <select id="setVoiceName">${enVoices().map((v,i)=>`<option value="${esc(v.name)}" ${voiceEn&&v.name===voiceEn.name?'selected':''}>${esc(v.name.replace(/^(Microsoft|Google) /,''))}${i===0?' (추천)':''}</option>`).join('')||'<option value="">기기 기본 목소리</option>'}</select></label>
    <p class="sub" style="font-size:12.5px;margin:0">목소리를 바꾸면 바로 들려줘요. 더 원어민 같은 목소리: 아이폰은 설정 › 손쉬운 사용 › 말하기 콘텐츠 › 음성 › 영어에서 'Ava(향상됨)'를 내려받고, 컴퓨터는 엣지 브라우저로 열면 자연스러운 목소리(Natural)가 나와요.</p>
    <label>읽기 속도 <select id="setRate"><option value=".7">느리게</option><option value=".9">보통</option><option value="1">빠르게</option></select></label>
    <div class="stats"><span>레벨<b>${level()}</b></span><span>모험 시간<b>${Math.floor(S.playSec/60)}분</b></span><span>물리친 몬스터<b>${st.kills}</b></span><span>잡은 도망자<b>${st.caught}</b></span>
      <span>미션 보스<b>${st.bosses}</b></span><span>생활 미션<b>${st.npc}</b></span><span>한 번에 정답<b>${st.right}</b></span><span>외운 주문<b>${Object.keys(S.spells).length}</b></span></div>
    ${isWeb()?`<div class="row"><button class="btn" id="toSync">${cloud.ref&&cloud.ref.web?'기기 연결됨: '+esc(cloud.ref.id)+' (바꾸기)':'어느 기기에서나 이어하기 (ID 연결)'}</button></div>`:''}
    <p class="sub" style="font-size:13px">${cloud.ref&&cloud.ref.web?'ID '+esc(cloud.ref.id)+'로 서버에 자동 저장되고 있어요. 다른 기기에서도 같은 ID·비밀번호로 이어서 할 수 있어요.':cloud.on?'진행 상황이 Claude 계정에 저장돼서 휴대폰과 PC에서 이어서 할 수 있어요.':(window.claude?'지금은 이 기기에만 저장되고 있어요. Claude에 로그인한 상태로 열면 계정에 저장돼요.':'진행 상황은 이 기기 브라우저에 저장돼요. 다른 기기로 옮기려면 부모 설정의 백업 코드를 복사해서 새 기기에서 복원하세요.')}</p>
    <div class="row" style="justify-content:space-between"><button class="btn" id="toParent">부모 설정</button><button class="btn gold" id="setClose">닫기</button></div></div>`;
  $('#setRate').value=String(S.settings.rate<.8?.7:S.settings.rate>.95?1:.9);$('#modal').hidden=false;
}
function closeSettings(){const n=$('#setName').value.trim();if(n)S.name=n.slice(0,10);S.settings.sound=$('#setSound').checked;S.settings.voice=$('#setVoice').checked;S.settings.rate=+$('#setRate').value;save();renderHUD();$('#modal').hidden=true}
let gateCb=null,gateAns=0;
function parentGate(cb){const a=6+(Math.random()*4|0),b=6+(Math.random()*4|0);gateAns=a*b;gateCb=cb;
  $('#modal').innerHTML=`<div class="sheet" data-set="1"><p class="h2">부모님 확인</p><p class="sub">${a} × ${b} = ?</p><input type="number" class="field-in" id="gateIn" inputmode="numeric"><div class="row" style="justify-content:flex-end"><button class="btn" id="gateNo">취소</button><button class="btn gold" id="gateOk">확인</button></div></div>`;$('#modal').hidden=false;$('#gateIn').focus()}
function openParent(){
  const byCat={};SENTS.forEach(s=>{const c=s.pat?'패턴 '+s.pat+'. '+PATTERN_NAMES[s.pat]:{help:'도움 요청',class:'교실',friend:'친구',food:'급식',safe:'몸·안전',custom:'직접 추가'}[s.cat];(byCat[c]=byCat[c]||[]).push(s)});
  $('#modal').innerHTML=`<div class="sheet" data-set="1"><p class="h2">부모 설정</p>
    <label>하루 플레이 시간 <select id="pLimit">${[0,20,30,45,60,90].map(m=>`<option value="${m}" ${S.settings.limit===m?'selected':''}>${m?m+'분':'제한 없음'}</option>`).join('')}</select></label>
    <p class="sub" style="margin:0">오늘 플레이: ${Math.floor(S.day.sec/60)}분</p>
    <div><p class="h2" style="font-size:17px">학습 문장 추가</p><p class="sub">빈칸으로 낼 단어를 [ ]로 감싸요. 예: I [need] some water.</p>
      <input class="field-in" id="pEn" placeholder="I [need] some water." style="margin-top:6px"><input class="field-in" id="pKo" placeholder="물이 필요해요." style="margin-top:6px;font-family:var(--body)">
      <input class="field-in" id="pOpt" placeholder="오답 2개 (예: want, have) — 비우면 자동" style="margin-top:6px;font-family:var(--body);font-size:15px"><div class="row" style="margin-top:6px"><button class="btn gold" id="pAdd">추가</button><span id="pMsg" class="sub" style="margin:0"></span></div></div>
    <div><p class="h2" style="font-size:17px">문장 빼기</p><p class="sub">체크를 풀면 게임에 나오지 않아요.</p><div class="excl">${Object.entries(byCat).map(([c,l])=>`<b style="margin-top:6px">${esc(c)}</b>`+l.map(s=>`<label><input type="checkbox" data-ex="${s.id}" ${active(s)?'checked':''}> ${esc(s.en)}</label>`).join('')).join('')}</div></div>
    <div><p class="h2" style="font-size:17px">백업 · 복원</p><p class="sub">백업 코드를 복사해 두면 나중에 붙여 넣어 되살릴 수 있어요.</p>
      <div class="row" style="margin-top:6px"><button class="btn" id="pCopy">백업 코드 복사</button><button class="btn" id="pRestore">붙여 넣은 코드로 복원</button></div><textarea id="pCode" placeholder="여기에 백업 코드가 나오거나, 복원할 코드를 붙여 넣어요"></textarea></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="pReset">처음부터 다시</button><button class="btn gold" id="pClose">닫기</button></div></div>`;
  $('#modal').hidden=false;
}
let resetArm=false;
$('#gearBtn').innerHTML=ICON.gear;$('#gearBtn').addEventListener('click',()=>{openSettings()});
$('#modal').addEventListener('click',async e=>{
  if(!$('#modal').querySelector('[data-set]'))return;const id=e.target.id;
  if(id==='setClose'||(id==='modal'&&$('#setName'))){closeSettings();return}
  if(id==='sndTest'){unlockAudio();S.settings.sound=$('#setSound').checked=true;S.settings.voice=$('#setVoice').checked=true;renderSnd();beep(660,.15,'triangle',.1);speak('Hello, Ming! Can you hear me?');
    let n=0;try{n=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).length}catch(_){}
    $('#sndMsg').textContent=n?'효과음과 영어 목소리가 나와야 해요':'효과음만 나와요. 이 브라우저에는 영어 목소리가 없어요 (크롬·휴대폰에서는 나와요)';return}
  if(id==='toParent'){closeSettings();parentGate(openParent);return}
  if(id==='toSync'){closeSettings();openSync();return}
  if(id==='gateOk'){if(+$('#gateIn').value===gateAns){const cb=gateCb;$('#modal').hidden=true;cb&&cb()}else{$('#gateIn').value='';toast('답이 달라요')}return}
  if(id==='gateNo'||(id==='modal'&&$('#gateIn'))){$('#modal').hidden=true;return}
  if(id==='pClose'||(id==='modal'&&$('#pLimit'))){S.settings.limit=+$('#pLimit').value;save();$('#modal').hidden=true;return}
  const ex=e.target.closest('[data-ex]');if(ex){const sid=+ex.dataset.ex;S.excluded=ex.checked?S.excluded.filter(x=>x!==sid):[...S.excluded,sid];save();return}
  if(id==='pAdd'){const raw=$('#pEn').value.trim(),ko=$('#pKo').value.trim(),m=raw.match(/\[([^\]]+)\]/);
    if(!m||!ko){$('#pMsg').textContent='[빈칸]과 뜻을 모두 써 주세요';return}
    const key=m[1].trim(),en=raw.replace(/\[|\]/g,'').replace(/\s+/g,' ');
    let opts=$('#pOpt').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,2);
    if(opts.length<2){const same=SENTS.find(s=>s.key===key);opts=same?same.opts.slice():shuffle(['need','want','have','like','can','know'].filter(x=>x!==key)).slice(0,2)}
    S.custom.push({en,ko,key,opts});buildSents();save();$('#pMsg').textContent='추가했어요: '+en;$('#pEn').value='';$('#pKo').value='';$('#pOpt').value='';return}
  if(id==='pCopy'){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#pCode').value=code;try{await navigator.clipboard.writeText(code);toast('백업 코드를 복사했어요')}catch(_){$('#pCode').select();toast('코드를 길게 눌러 복사해 주세요')}return}
  if(id==='pRestore'){try{const d=JSON.parse(decodeURIComponent(escape(atob($('#pCode').value.trim()))));S=migrate(d);S.savedAt=Date.now();buildSents();save();resetWorld();renderAll();$('#modal').hidden=true;toast('복원했어요')}catch(_){toast('코드가 올바르지 않아요')}return}
  if(id==='pReset'){if(!resetArm){resetArm=true;e.target.textContent='한 번 더 누르면 모두 지워져요';e.target.classList.add('warn');return}
    const keep=S.settings;S=migrate(null);S.settings=keep;S.savedAt=Date.now();buildSents();save();resetWorld();renderAll();$('#modal').hidden=true;resetArm=false;toast('새 모험을 시작해요')}
});
$('#modal').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gateIn')$('#gateOk').click()});

/* =========================================================
   9. 시작
   ========================================================= */
$('#ic-coin').innerHTML=ICON.coin;$('#ic-gem').innerHTML=ICON.gem;
/* 오프닝 화면 */
function renderOpening(){
  $('#opArt').innerHTML=`<div class="a-m2">${mobSVG('goblin')}</div><div class="a-pet">${petSVG(S.pet||'togyeol')}</div>`+
    `<div class="a-hero">${heroSVG(lookT(),S.armor,S.boots,pet()?.c,true)}</div><div class="a-m1">${mobSVG('warlord','#5a2d82')}</div>`;
  $('#opArt').querySelectorAll('div').forEach(d=>{const sv=d.firstElementChild;sv.setAttribute('class',d.className);d.replaceWith(sv)});
}
(function embers(){const o=$('#embers');for(let i=0;i<22;i++){const e=document.createElement('i');e.className='ember';e.style.left=Math.random()*100+'%';
  e.style.setProperty('--dx',(Math.random()*80-40)+'px');e.style.animationDuration=(5+Math.random()*7)+'s';e.style.animationDelay=(-Math.random()*10)+'s';o.appendChild(e)}})();
$('#startBtn').addEventListener('click',()=>{unlockAudio();
  if(isWeb()&&!syncCreds()){let skip=null;try{skip=localStorage.getItem(SYNC_KEY+'-skip')}catch(_){}if(!skip)setTimeout(openSync,300)}
  $('#opening').hidden=true;G.started=true;last=performance.now();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  pickVoice();fitStage();resize();renderAll();jingle([392,523,659,784],90);setTimeout(()=>speak("Let's go!"),400);
});

G.hero.hp=maxHp();resize();renderAll();renderOpening();pickVoice();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();clearTimeout(saveT);pushCloud()}});
requestAnimationFrame(loop);
initCloud();
</script>
